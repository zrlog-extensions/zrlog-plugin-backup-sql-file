<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.7">
    <h2 style="margin:0 0 12px">数据库备份完成</h2>
    <table style="border-collapse:collapse;min-width:320px">
        <tr>
            <td style="padding:6px 12px 6px 0;color:#666">备份文件</td>
            <td style="padding:6px 0;font-weight:600">${fileName}</td>
        </tr>
        <tr>
            <td style="padding:6px 12px 6px 0;color:#666">归档文件数</td>
            <td style="padding:6px 0;font-weight:600">${filesCount}</td>
        </tr>
        <tr>
            <td style="padding:6px 12px 6px 0;color:#666">文件状态</td>
            <td style="padding:6px 0;font-weight:600">${newFileText}</td>
        </tr>
    </table>
    <p style="white-space:pre-wrap;margin-top:12px">${message}</p>
</div>
